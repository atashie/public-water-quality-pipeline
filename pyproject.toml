[project]
name = "public-water-quality-pipeline"
version = "0.1.0"
description = "Ingest, QA/QC, process, and serve open water-quality data derived from Sentinel-3"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/atashie/public-water-quality-pipeline"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]
datasets = [
    "boto3>=1.35,<2",
    "geopandas>=1.0,<2",
    "netCDF4>=1.7,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<30",
    "pyproj>=3.6,<4",
    "rasterio>=1.4,<2",
    "requests>=2.32,<3",
    "shapely>=2,<3",
    "websocket-client>=1.8,<2",
    "xarray>=2024.6,<2028",
]

[tool.uv]
package = false
default-groups = ["dev", "datasets"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "datasets"]
pythonpath = ["."]
